name: scrape

# 排程用的是 UTC，台灣時間 = UTC + 8。依據人事總處頁面公告的發布時限，在最可能公告的時段加密：
#   台灣 18:00–23:59（前一晚 19:00～22:00 前發布全日或上午停班課）→ UTC 10–15 點，每 10 分鐘
#   台灣 04:00–05:59（當天 4:30 前發布）                           → UTC 20–21 點，每 10 分鐘
#   台灣 09:00–11:59（當天 10:30 前發布下午或晚間停班課）           → UTC 01–03 點，每 10 分鐘
#   其餘時間                                                       → 每 30 分鐘
# 四行加起來剛好涵蓋 24 小時，彼此不重疊（不會同一分鐘跑兩次）。
# 分鐘數刻意錯開整點與整十分（密集窗口在每小時的第 4、14、24… 分，其餘時間在第 7、37 分）：
# GitHub 文件說明每小時開頭是排程的高負載時段，常被延後甚至丟掉。
# GitHub 的排程不準時，尖峰常延遲 5～30 分鐘，偶爾會跳過，所以這裡的間隔是「盡量」而不是保證。
# 新建的 repo 第一次排程可能很晚才開始（2026-10-29 建立後約 3 小時沒有任何排程執行），所以重新 push 過這個檔案。
on:
  schedule:
    - cron: '4-54/10 10-15 * * *'
    - cron: '4-54/10 20-21 * * *'
    - cron: '4-54/10 1-3 * * *'
    - cron: '7,37 0,4-9,16-19,22-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同時只跑一個，避免兩次執行同時 push
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Node version
        run: node --version

      - name: Scrape
        run: node src/scrape.mjs

      # 資料沒有變就不會有任何差異，也就不會 commit。
      # 被擋、版面改了的時候爬蟲會讓上一步「失敗」（GitHub 才會寄通知信給你），但錯誤狀態要寫進 data/ 讓讀取資料的人看到，
      # 所以這一步即使上一步失敗也要執行
      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push || { git pull --rebase && git push; }
          fi
